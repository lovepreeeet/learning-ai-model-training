<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Dinosaur Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    #game {
      position: relative;
      width: min(800px, 96vw);
      height: 300px;
      overflow: hidden;
      background: white;
      border-bottom: 3px solid #222;
    }

    #dinosaur {
      position: absolute;
      left: 80px;
      bottom: 0;
      width: 40px;
      height: 50px;
      background: #222;
    }

    #obstacle {
      position: absolute;
      left: 800px;
      bottom: 0;
      width: 30px;
      height: 50px;
      background: #d33;
    }

    #message {
      position: absolute;
      top: 24px;
      width: 100%;
      text-align: center;
      color: #333;
      font-size: 18px;
    }

    #score {
      position: absolute;
      top: 12px;
      left: 16px;
      color: #222;
      font-size: 18px;
      font-weight: bold;
    }

    #controls {
      width: min(800px, 96vw);
    }

    #start-button,
    #history-button {
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    #history {
      margin-top: 12px;
      max-height: 300px;
      overflow-y: auto;
      background: white;
    }

    #history table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    #history th,
    #history td {
      padding: 6px 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
  </style>
</head>

<body>

  <div id="game">
    <div id="score">Score: 0</div>
    <div id="message">Press Start game to play</div>
    <div id="dinosaur"></div>
    <div id="obstacle"></div>
  </div>

  <div id="controls">
    <button id="start-button" type="button">Start game</button>
    <button id="history-button" type="button">Show score history</button>
    <div id="history" hidden></div>
  </div>

  <script type="module" src="./script.js"></script>
</body>

</html>
